<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrola Envenenada - Jukebox Retro</title>
    <style>
        :root {
            --bg-dark: #121215;
            --panel-bg: #1e1e24;
            --accent: #ff2a5f;
            --text-main: #f5f5f5;
            --text-muted: #888;
            --wood: #3e2723;
            --metallic: #b0bec5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2.5em;
            margin-top: 0;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
        }

        /* Contenedor Principal */
        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        /* Sección Superior: Vitrola + Video */
        .top-section {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: space-between;
            align-items: stretch;
        }

        /* --- LA VITROLA (Izquierda) --- */
        .turntable-panel {
            background: linear-gradient(145deg, #2a2a32, #1a1a1f);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .turntable-base {
            width: 320px;
            height: 320px;
            background: #d7ccc8; /* Color base retro/crema */
            border-radius: 15px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-record {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #0a0a0a 30%, #222 35%, #111 40%, #0a0a0a 45%, #222 55%, #000 65%);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .vinyl-record.spinning {
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vinyl-cover-center {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #111;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* EL BRAZO / LA PÚA */
        .tonearm {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 15px;
            height: 160px;
            background: linear-gradient(to right, #ccc, #eee, #999);
            border-radius: 10px;
            transform-origin: 10px 15px;
            transform: rotate(-15deg); /* Posición de descanso */
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
        }

        /* Base metálica del brazo */
        .tonearm::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -12.5px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fff, #888);
            border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        /* Cabezal / Aguja */
        .tonearm::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -5px;
            width: 25px;
            height: 40px;
            background: #222;
            border-radius: 4px;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.4);
        }

        .tonearm.playing {
            transform: rotate(30deg); /* Se mueve sobre el disco */
        }


        /* --- VIDEO GRANDE (Derecha) --- */
        .video-panel {
            flex: 1;
            min-width: 400px;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 10px;
            border: 2px solid #333;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .player-container {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            flex-grow: 1;
        }


        /* --- ESTANTERÍA DE DISCOS (Abajo) --- */
        .shelf-panel {
            width: 100%;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #333;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .shelf-panel h2 {
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .disks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 25px;
        }

        .disk-item {
            background: #2a2a32;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: 1px solid transparent;
        }

        .disk-item:hover {
            transform: translateY(-8px);
            background: #353540;
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(255, 42, 95, 0.2);
        }

        .disk-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 12px;
        }

        .disk-title {
            font-size: 1.05em;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .disk-artist {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Vitrola Envenenada</h1>

    <div class="layout-container">
        
        <!-- SECCIÓN SUPERIOR: Vitrola a la izquierda, Video a la derecha -->
        <div class="top-section">
            
            <!-- Vitrola -->
            <div class="turntable-panel">
                <div class="turntable-base">
                    <!-- Brazo y Púa -->
                    <div class="tonearm" id="tonearm"></div>
                    
                    <!-- Disco -->
                    <div class="vinyl-record" id="vinyl">
                        <img src="https://via.placeholder.com/150" id="vinyl-cover" class="vinyl-cover-center" alt="Portada">
                    </div>
                </div>
            </div>

            <!-- Reproductor de Video Grande -->
            <div class="video-panel">
                <div class="player-container">
                    <div id="youtube-player"></div>
                </div>
            </div>

        </div>

        <!-- SECCIÓN INFERIOR: Estantería de discos -->
        <div class="shelf-panel">
            <h2>Estantería de Discos</h2>
            <div class="disks-grid" id="disks-container"></div>
        </div>

    </div>

    <!-- Script de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const coleccionOriginal = [
            {
                url: "https://youtube.com/playlist?list=OLAK5uy_lSm1uzak9h6ch0cuF0v71-Eu9SSZBR-ao&si=FuDxcIcP8qk5X7cX",
                titulo: "Toxic Reign",
                artista: "Cyber Gas",
                caratula: "portadas/watermarked_img_11195355707298233413.jpg" /*[cite: 1] */
            },
            {
                url: "https://www.youtube.com/watch?v=jfKfPfyJRdk",
                titulo: "Lofi Beats",
                artista: "Lofi Girl",
                caratula: "https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?w=300"
            },
            {
                url: "https://www.youtube.com/watch?v=5qap5aO4i9A",
                titulo: "Synthwave Mix",
                artista: "Retro Station",
                caratula: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300"
            }
        ];

        let player;

        // Limpia el enlace automáticamente
        function procesarEnlace(urlOriginal) {
            const listMatch = urlOriginal.match(/[?&]list=([^&]+)/);
            if (listMatch) return { id: listMatch[1], esPlaylist: true };
            
            const videoMatch = urlOriginal.match(/(?:[?&]v=|youtu\.be\/)([^&]+)/);
            if (videoMatch) return { id: videoMatch[1], esPlaylist: false };
            
            return null;
        }

        // Inicia el reproductor de YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        // Controla la animación del vinilo y del brazo metálico
        function onPlayerStateChange(event) {
            const vinyl = document.getElementById('vinyl');
            const tonearm = document.getElementById('tonearm');
            
            if (event.data === YT.PlayerState.PLAYING) {
                vinyl.classList.add('spinning');
                tonearm.classList.add('playing'); // La púa se mueve al disco
            } else {
                vinyl.classList.remove('spinning');
                tonearm.classList.remove('playing'); // La púa vuelve a descansar
            }
        }

        // Carga visual de la estantería
        function cargarEstanteria() {
            const container = document.getElementById('disks-container');
            container.innerHTML = '';

            coleccionOriginal.forEach((disco, index) => {
                const infoExtraida = procesarEnlace(disco.url);
                if (!infoExtraida) return;

                const el = document.createElement('div');
                el.className = 'disk-item';
                el.onclick = () => reproducirDisco(index, infoExtraida);

                el.innerHTML = `
                    <img src="${disco.caratula}" alt="${disco.titulo}">
                    <div class="disk-title">${disco.titulo}</div>
                    <div class="disk-artist">${disco.artista}</div>
                `;
                container.appendChild(el);
            });
        }

        // Acción al hacer clic en un disco
        function reproducirDisco(index, infoExtraida) {
            const disco = coleccionOriginal[index];
            document.getElementById('vinyl-cover').src = disco.caratula;

            if (infoExtraida.esPlaylist) {
                player.loadPlaylist({
                    list: infoExtraida.id,
                    listType: 'playlist',
                    index: 0
                });
            } else {
                player.loadVideoById(infoExtraida.id);
            }
        }

        window.onload = cargarEstanteria;
    </script>
</body>
</html>
