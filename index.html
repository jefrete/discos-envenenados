<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox de Vinilos Retro</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            margin-bottom: 20px;
        }

        .jukebox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        /* Reproductor Tocadiscos */
        .turntable {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 320px;
        }

        .vinyl-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #000 30%, #222 31%, #111 60%, #000 61%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .vinyl-record.spinning {
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover-center {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #000;
        }

        /* YouTube Iframe (El reproductor oficial inyectado por la API) */
        .player-container {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        /* Estantería de Discos */
        .shelf {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .shelf h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .disks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .disk-item {
            background: #2a2a32;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-align: center;
        }

        .disk-item:hover {
            transform: translateY(-5px);
            background: #353540;
        }

        .disk-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .disk-title {
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .disk-artist {
            font-size: 0.75em;
            color: var(--text-dim);
        }

        .badge {
            display: inline-block;
            font-size: 0.65em;
            background: var(--accent-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Vitrola Envenenada</h1>

    <div class="jukebox-container">
        <!-- Tocadiscos Visual -->
        <div class="turntable">
            <div class="vinyl-wrapper">
                <div class="vinyl-record" id="vinyl">
                    <img src="https://via.placeholder.com/150" id="vinyl-cover" class="vinyl-cover-center" alt="Portada">
                </div>
            </div>
            <!-- Contenedor donde la API inyectará el iframe oficial -->
            <div class="player-container">
                <div id="youtube-player"></div>
            </div>
        </div>

        <!-- Estantería de Discos -->
        <div class="shelf">
            <h2>Colección de Discos</h2>
            <div class="disks-grid" id="disks-container"></div>
        </div>
    </div>

    <!-- Script de la API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        /*
        =============================================================================
        TUTORIAL: CÓMO CARGAR TUS DISCOS (ÁLBUMES COMPLETOS Y CANCIONES SUELTAS)
        =============================================================================
        
        1. CÓMO OBTENER EL ID PARA UN ÁLBUM COMPLETO (PLAYLIST OFICIAL):
           - Ve a YouTube y busca el álbum o lista de reproducción.
           - La URL se verá así: https://www.youtube.com/watch?v=...&list=OLAK5uy_lSm1uzak9h6ch0cuF0v71-Eu9SSZBR-ao
           - Copia SOLO lo que está después de "list=" (ej. OLAK5uy_lSm1uzak9h6ch0cuF0v71-Eu9SSZBR-ao).
           - Pon 'esPlaylist: true' en la configuración del disco.

        2. CÓMO OBTENER EL ID PARA UNA CANCIÓN SUELTA:
           - Ve a YouTube y busca el vídeo individual.
           - La URL se verá así: https://www.youtube.com/watch?v=jfKfPfyJRdk
           - Copia SOLO lo que está después de "v=" (ej. jfKfPfyJRdk).
           - Pon 'esPlaylist: false' en la configuración del disco.

        3. DÓNDE Y CON QUÉ NOMBRE GUARDAR LAS PORTADAS:
           - Crea una carpeta llamada "portadas" al mismo nivel donde guardas este archivo index.html.
           - Guarda tus imágenes ahí (te sugiero hacerlas cuadradas, formato .jpg o .png).
           - Si usas la imagen que compartiste antes, guárdala en esa carpeta. Puedes mantener su nombre original "watermarked_img_11195355707298233413.jpg"[cite: 1] o cambiarle el nombre a uno más corto como "toxic-reign.jpg".
           - En el código, la ruta se escribe así: "portadas/toxic-reign.jpg" (o el nombre que decidas).
        =============================================================================
        */

        const coleccionOriginal = [
            {
                // Ejemplo de ÁLBUM COMPLETO
                id: "OLAK5uy_lSm1uzak9h6ch0cuF0v71-Eu9SSZBR-ao", // ID sacado del parámetro list=
                esPlaylist: true,
                titulo: "Toxic Reign",
                artista: "Cyber Gas",
                caratula: "portadas/watermarked_img_11195355707298233413.jpg" // Ruta a la carpeta de portadas usando el nombre de tu archivo[cite: 1]
            },
            {
                // Ejemplo de CANCIÓN SUELTA
                id: "jfKfPfyJRdk", // ID sacado del parámetro v=
                esPlaylist: false,
                titulo: "Lofi Beats",
                artista: "Lofi Girl",
                caratula: "https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?w=300" // También puedes usar links de internet directamente
            }
        ];

        let player;
        let discoActual = null;

        // Función que inicializa la API oficial de Google de forma legal
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 0, // YouTube requiere autoplay apagado inicialmente para cumplir sus políticas
                    'controls': 1  // Mantiene los controles visibles
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Controla la animación del vinilo escuchando el estado oficial del Iframe
        function onPlayerStateChange(event) {
            const vinyl = document.getElementById('vinyl');
            // YT.PlayerState.PLAYING significa que la música empezó a sonar (estado 1)
            if (event.data === YT.PlayerState.PLAYING) {
                vinyl.classList.add('spinning');
            } else {
                vinyl.classList.remove('spinning');
            }
        }

        // Construye la cuadrícula de discos leyendo la variable coleccionOriginal
        function cargarEstanteria() {
            const container = document.getElementById('disks-container');
            container.innerHTML = '';

            coleccionOriginal.forEach((disco, index) => {
                const el = document.createElement('div');
                el.className = 'disk-item';
                el.onclick = () => reproducirDisco(index);

                el.innerHTML = `
                    <img src="${disco.caratula}" alt="${disco.titulo}">
                    <div class="disk-title">${disco.titulo}</div>
                    <div class="disk-artist">${disco.artista}</div>
                    <span class="badge">${disco.esPlaylist ? 'ÁLBUM' : 'TEMA'}</span>
                `;
                container.appendChild(el);
            });
        }

        // Inyecta el ID correcto en el Iframe dependiendo si es álbum o canción
        function reproducirDisco(index) {
            const disco = coleccionOriginal[index];
            discoActual = disco;

            // Cambia la imagen central del vinilo
            document.getElementById('vinyl-cover').src = disco.caratula;

            if (disco.esPlaylist) {
                // Carga la lista completa oficial
                player.loadPlaylist({
                    list: disco.id,
                    listType: 'playlist',
                    index: 0
                });
            } else {
                // Carga el vídeo individual oficial
                player.loadVideoById(disco.id);
            }
        }

        // Ejecutar la creación de la estantería cuando la página termine de cargar
        window.onload = cargarEstanteria;
    </script>
</body>
</html>
