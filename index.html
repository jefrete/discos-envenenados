<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox de Vinilos Retro</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            margin-bottom: 20px;
        }

        .jukebox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        /* Reproductor Tocadiscos */
        .turntable {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 320px;
        }

        .vinyl-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #000 30%, #222 31%, #111 60%, #000 61%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .vinyl-record.spinning {
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover-center {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #000;
        }

        /* YouTube Iframe */
        .player-container {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        /* Estantería de Discos */
        .shelf {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .shelf h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .disks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .disk-item {
            background: #2a2a32;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-align: center;
        }

        .disk-item:hover {
            transform: translateY(-5px);
            background: #353540;
        }

        .disk-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .disk-title {
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .disk-artist {
            font-size: 0.75em;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <h1>Vitrola Envenenada</h1>

    <div class="jukebox-container">
        <div class="turntable">
            <div class="vinyl-wrapper">
                <div class="vinyl-record" id="vinyl">
                    <img src="https://via.placeholder.com/150" id="vinyl-cover" class="vinyl-cover-center" alt="Portada">
                </div>
            </div>
            <div class="player-container">
                <div id="youtube-player"></div>
            </div>
        </div>

        <div class="shelf">
            <h2>Colección de Discos</h2>
            <div class="disks-grid" id="disks-container"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // =============================================================================
        // AHORA SOLO PEGAS EL ENLACE COMPLETO EN "url". EL CÓDIGO HACE EL RESTO.
        // =============================================================================
        const coleccionOriginal = [
            {
                url: "https://youtube.com/playlist?list=OLAK5uy_lSm1uzak9h6ch0cuF0v71-Eu9SSZBR-ao&si=FuDxcIcP8qk5X7cX", // Tu enlace crudo
                titulo: "Toxic Reign",
                artista: "Cyber Gas",
                caratula: "portadas/watermarked_img_11195355707298233413.jpg" // Usa tu imagen local[cite: 1]
            },
            {
                url: "https://www.youtube.com/watch?v=jfKfPfyJRdk&ab_channel=LofiGirl", // Enlace crudo de una canción
                titulo: "Lofi Beats",
                artista: "Lofi Girl",
                caratula: "https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?w=300"
            }
        ];

        let player;

        // Función inteligente para limpiar el link
        function procesarEnlace(urlOriginal) {
            // Si tiene "list=", extrae el ID de la playlist y descarta el resto
            const listMatch = urlOriginal.match(/[?&]list=([^&]+)/);
            if (listMatch) {
                return { id: listMatch[1], esPlaylist: true };
            }
            // Si tiene "v=", extrae el ID del video y descarta el resto
            const videoMatch = urlOriginal.match(/(?:[?&]v=|youtu\.be\/)([^&]+)/);
            if (videoMatch) {
                return { id: videoMatch[1], esPlaylist: false };
            }
            return null; // Por si el enlace no es válido
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            const vinyl = document.getElementById('vinyl');
            if (event.data === YT.PlayerState.PLAYING) {
                vinyl.classList.add('spinning');
            } else {
                vinyl.classList.remove('spinning');
            }
        }

        function cargarEstanteria() {
            const container = document.getElementById('disks-container');
            container.innerHTML = '';

            coleccionOriginal.forEach((disco, index) => {
                const infoExtraida = procesarEnlace(disco.url);
                if (!infoExtraida) return; // Si el enlace está mal, se lo salta

                const el = document.createElement('div');
                el.className = 'disk-item';
                el.onclick = () => reproducirDisco(index, infoExtraida);

                el.innerHTML = `
                    <img src="${disco.caratula}" alt="${disco.titulo}">
                    <div class="disk-title">${disco.titulo}</div>
                    <div class="disk-artist">${disco.artista}</div>
                `;
                container.appendChild(el);
            });
        }

        function reproducirDisco(index, infoExtraida) {
            const disco = coleccionOriginal[index];
            document.getElementById('vinyl-cover').src = disco.caratula;

            if (infoExtraida.esPlaylist) {
                player.loadPlaylist({
                    list: infoExtraida.id,
                    listType: 'playlist',
                    index: 0
                });
            } else {
                player.loadVideoById(infoExtraida.id);
            }
        }

        window.onload = cargarEstanteria;
    </script>
</body>
</html>
